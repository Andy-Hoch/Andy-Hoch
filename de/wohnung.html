<!doctype html>
<html lang="de">
<head>

<title>Wohnung Familie Hoch – 3D</title>
<style>
  :root { --ink:#1d2026; --muted:#6b7280; --line:#e3e5e8; --accent:#1f6feb; }
  html, body { margin:0; height:100%; overflow:hidden; background:#eceff2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; z-index:1; }   /* eigener Stapelkontext: Labels unter dem Panel */
  .label { text-align:center; line-height:1.15; padding:4px 8px; border-radius:7px; background:rgba(255,255,255,.82); box-shadow:0 1px 4px rgba(0,0,0,.12); backdrop-filter: blur(3px); white-space:nowrap; }
  .label b { display:block; font-size:13px; font-weight:650; }
  .label span { display:block; font-size:11px; color:var(--muted); }
  #panel { position:absolute; top:16px; left:16px; width:236px; padding:14px 14px 12px; border-radius:12px; background:rgba(255,255,255,.92); box-shadow:0 4px 20px rgba(0,0,0,.12); backdrop-filter: blur(6px); font-size:13px; z-index:5; }
  #panel { transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s; }
  #panel.collapsed { transform: translateX(calc(-100% - 24px)); opacity:0; pointer-events:none; }
  #panel h1 { font-size:15px; margin:0 0 2px; padding-right:32px; }
  .icon-btn { position:absolute; top:10px; right:10px; width:28px; height:28px; display:grid; place-items:center; padding:0; border:0; border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; }
  .icon-btn:hover { background:#f4f5f7; color:var(--ink); }
  .icon-btn svg, #btnShow svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #btnShow { position:absolute; top:16px; left:0; width:28px; height:44px; display:grid; place-items:center; padding:0; border:0; border-radius:0 10px 10px 0; background:rgba(255,255,255,.92); box-shadow:0 4px 20px rgba(0,0,0,.12); backdrop-filter: blur(6px); color:var(--ink); cursor:pointer; z-index:5;
             opacity:0; transform:translateX(-100%); pointer-events:none; transition: transform .26s cubic-bezier(.2,.8,.2,1), opacity .26s; }
  #btnShow:hover { background:#fff; }
  body.panel-collapsed #btnShow { opacity:1; transform:none; pointer-events:auto; transition-delay:.12s; }
  body.preload #panel, body.preload #btnShow { transition:none !important; }
  @media (prefers-reduced-motion: reduce) { #panel, #btnShow { transition:none !important; } }
  #panel .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .gl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 6px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; border-right:1px solid var(--line); background:#fff; padding:7px 0; font:inherit; font-size:12px; cursor:pointer; }
  .seg button:last-child { border-right:0; }
  .seg button.active { background:var(--ink); color:#fff; }
  .btn { width:100%; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px; font:inherit; cursor:pointer; margin-bottom:6px; }
  .btn:hover, .seg button:not(.active):hover { background:#f4f5f7; }
  .btn.primary { background:#f7f3ea; border-color:#e4dccb; }
  .tog { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
  #help { position:absolute; left:16px; bottom:16px; max-width:calc(100% - 32px); padding:8px 12px; border-radius:9px; background:rgba(255,255,255,.85); font-size:12px; color:var(--muted); z-index:5; }
  #walkOverlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,22,26,.35); z-index:4; cursor:pointer; }
  #walkOverlay > div { background:#fff; padding:18px 24px; border-radius:12px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.2); max-width:320px; }
  #walkOverlay b { font-size:16px; }
  #walkOverlay p { margin:8px 0 0; font-size:13px; color:var(--muted); }
  #crosshair { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.35); display:none; z-index:4; pointer-events:none; }
  #crosshair.hot { width:12px; height:12px; margin:-6px 0 0 -6px; background:#ffd75e; }
  @media (max-width: 600px) { #panel { width:auto; right:16px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body class="preload">
<div id="panel">
  <button id="btnHide" class="icon-btn" aria-label="Bedienfeld ausblenden" title="Bedienfeld ausblenden">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
  </button>

  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------------------
// Koordinaten: Plan-X = Ost (m ab linker Außenkante), Plan-Y = Süd (m ab oberer
// Außenkante). three: x = X - OX, z = Y - OZ, y = Höhe. Norden = -z.
// ---------------------------------------------------------------------------
const H = 2.70, OX = 7.6, OZ = 5.0;
const wx = X => X - OX, wz = Y => Y - OZ;

// --- Renderer / Szene -------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceff2);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
const HOME = { pos: new THREE.Vector3(3, 13.5, 13), target: new THREE.Vector3(0, 0, 0.3) };
camera.position.copy(HOME.pos);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.copy(HOME.target);
orbit.enableDamping = true;
orbit.minDistance = 1.5;
orbit.maxDistance = 45;
orbit.maxPolarAngle = THREE.MathUtils.degToRad(88);
orbit.update();

// --- Licht -------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc6b8, 1.5));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.0);
sun.position.set(7, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// --- Texturen ----------------------------------------------------------------
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Eichenparkett: 8 Dielenreihen pro Kachel (Kachel = 1,44 m)
const woodTex = canvasTexture(1024, 1024, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * w * 0.5;
    while (x < w) {
      const len = w * (0.3 + rand() * 0.45);
      const l = 66 + rand() * 9;
      for (const off of [0, -w, w]) {
        g.fillStyle = `hsl(${30 + rand() * 6}, ${36 + rand() * 10}%, ${l}%)`;
        g.fillRect(x + off, r * rh, len, rh);
        g.strokeStyle = 'rgba(110,70,35,.10)';
        g.lineWidth = 1;
        for (let k = 0; k < 6; k++) {
          const yy = r * rh + 6 + rand() * (rh - 12);
          g.beginPath(); g.moveTo(x + off, yy);
          g.bezierCurveTo(x + off + len * .3, yy + (rand() - .5) * 8, x + off + len * .7, yy + (rand() - .5) * 8, x + off + len, yy);
          g.stroke();
        }
        g.fillStyle = 'rgba(90,60,30,.35)';
        g.fillRect(x + off + len - 1.5, r * rh, 1.5, rh);
      }
      x += len;
    }
    g.fillStyle = 'rgba(90,60,30,.35)';
    g.fillRect(0, r * rh, w, 1.5);
  }
});
// Dunkle Granitfliesen 60 × 60 cm (Kachel = 1,2 m)
const tileTex = canvasTexture(1024, 1024, (g, w, h) => {
  const n = 2, s = w / n;
  g.fillStyle = '#3b3c3e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x0 = i * s + 2, y0 = j * s + 2, ss = s - 4;
    g.fillStyle = `hsl(220, 4%, ${21 + rand() * 4}%)`;
    g.fillRect(x0, y0, ss, ss);
    for (let k = 0; k < 9000; k++) {
      const r = rand();
      g.fillStyle = r < 0.45 ? `rgba(0,0,0,${0.3 + rand() * 0.4})`
                  : r < 0.85 ? `rgba(105,106,112,${0.2 + rand() * 0.35})`
                  : `rgba(215,215,222,${0.25 + rand() * 0.5})`;
      const sz = 1 + rand() * 3;
      g.fillRect(x0 + rand() * (ss - sz), y0 + rand() * (ss - sz), sz, sz);
    }
  }
});
// Steinplatten (Kachel = 1,2 m)
const stoneTex = canvasTexture(512, 512, (g, w, h) => {
  const n = 2, s = w / n;
  g.fillStyle = '#8f8a82'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = `hsl(35, 8%, ${62 + rand() * 6}%)`;
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    for (let k = 0; k < 400; k++) {
      g.fillStyle = `rgba(${rand() > .5 ? '255,255,255' : '60,55,50'},.06)`;
      g.fillRect(i * s + rand() * s, j * s + rand() * s, 3, 3);
    }
  }
});
function texFor(base, w, d, tile) {
  const t = base.clone();
  t.repeat.set(w / tile, d / tile);
  t.needsUpdate = true;
  return t;
}

// --- Materialien ---------------------------------------------------------------
const M = {
  wall:   new THREE.MeshStandardMaterial({ color: 0xf4f2ed, roughness: 0.92 }),
  cut:    new THREE.MeshStandardMaterial({ color: 0x2a2b2e, roughness: 0.8 }),
  frame:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  sill:   new THREE.MeshStandardMaterial({ color: 0xe9e6df, roughness: 0.6 }),
  door:   new THREE.MeshStandardMaterial({ color: 0xfbfbf9, roughness: 0.55 }),
  glass:  new THREE.MeshPhysicalMaterial({ color: 0xcfe6f2, roughness: 0.05, transparent: true, opacity: 0.22, depthWrite: false }),
  frosted:new THREE.MeshStandardMaterial({ color: 0xf7f9f9, roughness: 1, transparent: true, opacity: 0.92, emissive: 0x3a3a38 }),
  wood:   new THREE.MeshStandardMaterial({ color: 0xa8743f, roughness: 0.7 }),
  metal:  new THREE.MeshStandardMaterial({ color: 0x4d5054, roughness: 0.4, metalness: 0.6 }),
  slab:   new THREE.MeshStandardMaterial({ color: 0xb9b6b0, roughness: 0.9 }),
  stair:  new THREE.MeshStandardMaterial({ color: 0xd8ccb6, roughness: 0.7 }),
  ceil:   new THREE.MeshStandardMaterial({ color: 0xfafaf8, roughness: 0.95, side: THREE.DoubleSide }),
  curtain:new THREE.MeshStandardMaterial({ color: 0xf6f1e7, roughness: 0.95, side: THREE.DoubleSide, emissive: 0x1c1a16 }),
  rail:   new THREE.MeshStandardMaterial({ color: 0xc9ccd0, roughness: 0.35, metalness: 0.7 }),
};
// Box-Materialreihenfolge: +x, -x, +y (Oberseite = Schnittfläche dunkel), -y, +z, -z
const wallMats = [M.wall, M.wall, M.cut, M.wall, M.wall, M.wall];
const woodMats = [M.wood, M.wood, M.cut, M.wood, M.wood, M.wood];

// --- Bau-Helfer ------------------------------------------------------------------
const solids = [];            // Kollisionsboxen für den Rundgang
const ceiling = new THREE.Group();
scene.add(ceiling);

function boxAt(cx, cz, lx, lz, h0, h1, mat, angle = 0, { solid = true, shadow = true, parent = scene } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(lx, h1 - h0, lz), mat);
  m.position.set(cx, (h0 + h1) / 2, cz);
  m.rotation.y = angle;
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  if (solid && h0 < 1.0) solids.push({ cx, cz, hx: lx / 2, hz: lz / 2, a: angle });
  return m;
}
const aabb = (x0, x1, y0, y1, h0, h1, mat, opts) =>
  boxAt(wx((x0 + x1) / 2), wz((y0 + y1) / 2), x1 - x0, y1 - y0, h0, h1, mat, 0, opts);

// Wand von a nach b (Plan-Koordinaten, Mittellinie), Dicke t, Öffnungen entlang der Wand (s0..s1 in m ab a)
function wall(a, b, t, ops = []) {
  const ax = wx(a[0]), az = wz(a[1]), bx = wx(b[0]), bz = wz(b[1]);
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const ux = dx / L, uz = dz / L, ang = Math.atan2(-dz, dx);
  const at = s => [ax + ux * s, az + uz * s];
  const seg = (s0, s1, h0, h1) => {
    if (s1 - s0 < 0.005 || h1 - h0 < 0.005) return;
    const [cx, cz] = at((s0 + s1) / 2);
    boxAt(cx, cz, s1 - s0, t, h0, h1, wallMats, ang);
  };
  ops = ops.map(o => o.full ? { ...o, s0: 0, s1: L } : o).sort((p, q) => p.s0 - q.s0);
  let cur = 0;
  for (const o of ops) {
    const sill = o.sill ?? 0, head = o.head ?? 2.05;
    seg(cur, o.s0, 0, H);
    seg(o.s0, o.s1, 0, sill);
    seg(o.s0, o.s1, head, H);
    if (o.kind === 'door') doorFrame(at, ang, o.s0, o.s1, head, t);
    else windowParts(at, ang, o.s0, o.s1, sill, head, t, o.kind, o.noSill);
    cur = o.s1;
  }
  seg(cur, L, 0, H);
}
function windowParts(at, ang, s0, s1, sill, head, t, kind, noSill = false) {
  const len = s1 - s0, [cx, cz] = at((s0 + s1) / 2), f = 0.06, fd = Math.min(0.08, t);
  const eps = sill > 0.1 && !noSill ? 0.008 : 0;   // Fensterbank minimal über der Brüstung (kein Z-Fighting)
  const nos = { solid: false };
  boxAt(cx, cz, len, 0.02, sill, head, kind === 'frosted' ? M.frosted : M.glass, ang, { solid: true, shadow: false });
  const [lx, lz] = at(s0 + f / 2), [rx, rz] = at(s1 - f / 2);
  boxAt(lx, lz, f, fd, sill, head, M.frame, ang, nos);
  boxAt(rx, rz, f, fd, sill, head, M.frame, ang, nos);
  boxAt(cx, cz, len, fd, head - f, head, M.frame, ang, nos);
  boxAt(cx, cz, len, fd, sill + eps, sill + eps + f, M.frame, ang, nos);
  if (len > 1.1) boxAt(cx, cz, f * 0.8, fd, sill, head, M.frame, ang, nos);
  if (eps) boxAt(cx, cz, len + 0.06, t + 0.06, sill - 0.03, sill + eps, M.sill, ang, nos);
}
function doorFrame(at, ang, s0, s1, head, t) {
  const fw = 0.04, [cx, cz] = at((s0 + s1) / 2);
  const [lx, lz] = at(s0 + fw / 2), [rx, rz] = at(s1 - fw / 2);
  const nos = { solid: false };
  boxAt(lx, lz, fw, t + 0.02, 0, head, M.frame, ang, nos);
  boxAt(rx, rz, fw, t + 0.02, 0, head, M.frame, ang, nos);
  boxAt(cx, cz, s1 - s0, t + 0.02, head - fw, head, M.frame, ang, nos);
}
// horizontale / vertikale Wand: Band y0..y1 bzw. x0..x1, Öffnungen in absoluten Plan-Koordinaten
const hWall = (y0, y1, x0, x1, ops = []) =>
  wall([x0, (y0 + y1) / 2], [x1, (y0 + y1) / 2], y1 - y0, ops.map(o => ({ ...o, s0: o.from - x0, s1: o.to - x0 })));
const vWall = (x0, x1, y0, y1, ops = []) =>
  wall([(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1], x1 - x0, ops.map(o => ({ ...o, s0: o.from - y0, s1: o.to - y0 })));
const Win  = (a, b, sill = 0.9, head = 2.30) => ({ from: a, to: b, sill, head, kind: 'window' });
const Door = (a, b, head = 2.05) => ({ from: a, to: b, sill: 0, head, kind: 'door' });

// Drehtür: Scharnier, Spitze im geschlossenen Zustand, Richtung im geöffneten Zustand (Plan-Koordinaten)
const doors = [], doorPick = [];
function door(hinge, closedTip, openTip, { glass = false, open = false } = {}) {   // Türen starten geschlossen
  const hx = wx(hinge[0]), hz = wz(hinge[1]);
  const cdx = wx(closedTip[0]) - hx, cdz = wz(closedTip[1]) - hz;
  const L = Math.hypot(cdx, cdz) - 0.02;
  const a0 = Math.atan2(-cdz, cdx);
  const a1 = Math.atan2(-(wz(openTip[1]) - hz), wx(openTip[0]) - hx);
  let delta = a1 - a0;
  while (delta > Math.PI) delta -= 2 * Math.PI;
  while (delta < -Math.PI) delta += 2 * Math.PI;
  const pivot = new THREE.Group();
  pivot.position.set(hx, 0, hz);
  scene.add(pivot);
  const d = { pivot, a0, delta, L, hx, hz, t: open ? 1 : 0, target: open ? 1 : 0 };
  const part = (lx, ly, lz, px, py, mat, shadow = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(lx, ly, lz), mat);
    m.position.set(px, py, 0);
    m.castShadow = shadow;
    m.receiveShadow = true;
    m.userData.door = d;
    pivot.add(m);
    doorPick.push(m);
  };
  const top = 2.02, bot = 0.01, mid = (top + bot) / 2;
  if (glass) {
    const f = 0.08, b = 0.14;
    part(f, top - bot, 0.045, f / 2, mid, M.door);
    part(f, top - bot, 0.045, L - f / 2, mid, M.door);
    part(L - 2 * f, f, 0.045, L / 2, top - f / 2, M.door);
    part(L - 2 * f, b, 0.045, L / 2, bot + b / 2, M.door);
    part(L - 2 * f, top - f - bot - b, 0.02, L / 2, (bot + b + top - f) / 2, M.frosted, false);
  } else {
    part(L, top - bot, 0.04, L / 2, mid, M.door);
  }
  part(0.12, 0.03, 0.12, L - 0.08, 1.05, M.metal, false);   // Türgriff beidseitig
  pivot.rotation.y = a0 + delta * d.t;
  doors.push(d);
  solids.push({ door: d });
}
const toggleDoor = d => { d.target = d.target ? 0 : 1; };
function doorBox(d) {
  const a = d.pivot.rotation.y;
  return { cx: d.hx + Math.cos(a) * d.L / 2, cz: d.hz - Math.sin(a) * d.L / 2, hx: d.L / 2, hz: 0.03, a };
}
function floor(x0, x1, y0, y1, tex, tile, y = 0, roughness = 0.75) {
  const w = x1 - x0, d = y1 - y0;
  const mat = new THREE.MeshStandardMaterial({ map: texFor(tex, w, d, tile), roughness });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(wx((x0 + x1) / 2), y, wz((y0 + y1) / 2));
  m.receiveShadow = true;
  scene.add(m);
}

// --- Umgebung & Böden -------------------------------------------------------------
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshStandardMaterial({ color: 0xe3e5e1, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.26;
  ground.receiveShadow = true;
  scene.add(ground);
}

{
  const n = 17, rise = 2.95 / n, tread = 0.248;
  for (let i = 0; i < 5; i++)
    aabb(6.49, 7.48, 7.12 + i * tread, 7.12 + (i + 1) * tread, 0, (i + 1) * rise, M.stair, { solid: false });
  const C = [7.60, 8.36], R0 = 0.12, X0 = 6.49, X1 = 8.72, Y1 = 9.57;
  const rayHit = th => {
    const c = Math.cos(th), s = Math.sin(th); let t = Infinity;
    if (c < -1e-9) t = Math.min(t, (X0 - C[0]) / c);
    if (c > 1e-9)  t = Math.min(t, (X1 - C[0]) / c);
    if (s > 1e-9)  t = Math.min(t, (Y1 - C[1]) / s);
    return [C[0] + c * t, C[1] + s * t];
  };
  const corners = [[X0, Y1], [X1, Y1]].map(p => [...p, Math.atan2(p[1] - C[1], p[0] - C[0])]);
  for (let k = 0; k < 7; k++) {
    const th0 = Math.PI - k * Math.PI / 7, th1 = Math.PI - (k + 1) * Math.PI / 7;
    const pts = [rayHit(th0)];
    corners.filter(c => c[2] < th0 && c[2] > th1).sort((p, q) => q[2] - p[2]).forEach(c => pts.push([c[0], c[1]]));
    pts.push(rayHit(th1));
    for (let m = 0; m <= 4; m++) {
      const th = th1 + (th0 - th1) * m / 4;
      pts.push([C[0] + R0 * Math.cos(th), C[1] + R0 * Math.sin(th)]);
    }
    const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(wx(p[0]), -wz(p[1]))));
    const g = new THREE.ExtrudeGeometry(shape, { depth: (6 + k) * rise, bevelEnabled: false });
    const mesh = new THREE.Mesh(g, M.stair);

// --- Helfer: lokal (Gruppe) ---------------------------------------------------------
function mk(geo, mat, parent, x, y, z, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Gruppe an Plan-Position; deg = Blickrichtung: 0 = Süd, 90 = Ost, 180 = Nord, -90 = West (lokal +z = vorne)
function grp(X, Y, deg = 0) {
  const g = new THREE.Group();
  g.position.set(wx(X), 0, wz(Y));
  g.rotation.y = THREE.MathUtils.degToRad(deg);
  furniture.add(g);
  return g;
}
const lb = (p, x0, x1, h0, h1, z0, z1, mat, shadow = true) =>
  mk(new THREE.BoxGeometry(x1 - x0, h1 - h0, z1 - z0), mat, p, (x0 + x1) / 2, (h0 + h1) / 2, (z0 + z1) / 2, shadow);
function ls(p, x0, x1, h0, h1, z0, z1, mat, r = 0.04) {
  const w = x1 - x0, h = h1 - h0, d = z1 - z0;
  r = Math.max(0.001, Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002));
  return mk(new RoundedBoxGeometry(w, h, d, 3, r), mat, p, (x0 + x1) / 2, (h0 + h1) / 2, (z0 + z1) / 2);
}
const lc = (p, x, z, rT, rB, h0, h1, mat, seg = 24, shadow = true) =>
  mk(new THREE.CylinderGeometry(rT, rB, h1 - h0, seg), mat, p, x, (h0 + h1) / 2, z, shadow);
const lsph = (p, x, h, z, r, mat, shadow = true) => mk(new THREE.SphereGeometry(r, 20, 14), mat, p, x, h, z, shadow);

  solids.push({ cx: g.position.x + ox * c + oz * s, cz: g.position.z - ox * s + oz * c, hx: (x1 - x0) / 2, hz: (z1 - z0) / 2, a, furn: true });
}

function rod(a, b, r, mat) {   // a, b = [X, Y, Höhe]
  const A = new THREE.Vector3(wx(a[0]), a[2], wz(a[1])), B = new THREE.Vector3(wx(b[0]), b[2], wz(b[1]));
  const d = B.clone().sub(A);

  m.position.copy(A).add(B).multiplyScalar(0.5);

}

  ls(g, -hw - 0.05, hw + 0.05, 0.08, 0.36, 0.06, l + 0.12, head, 0.03);       // Bettrahmen
  for (const sx of [-hw, hw]) lc(g, sx, l + 0.06, 0.02, 0.015, 0, 0.08, F.oak, 8);
  ls(g, -hw, hw, 0.36, 0.58, 0.1, l + 0.1, F.linen, 0.05);                    // Matratze
  ls(g, -hw - 0.03, hw + 0.03, 0.42, 0.64, 0.55, l + 0.13, F.linen, 0.06);    // Bettdecke
  ls(g, -hw - 0.05, hw + 0.05, 0.44, 0.655, l - 0.32, l + 0.15, throwMat, 0.05); // Plaid
  const pw = Math.min(0.8, hw - 0.05);
  for (const sx of [-1, 1]) {
    const m = ls(g, sx * (hw / 2) - pw / 2, sx * (hw / 2) + pw / 2, 0.6, 0.76, 0.13, 0.5, F.linen, 0.07);
    m.rotation.x = 0.35;
  }
  solid(g, -hw - 0.06, hw + 0.06, 0, l + 0.15);
}
function diningChair(X, Y, deg) {
  const g = grp(X, Y, deg);
  for (const sx of [-0.19, 0.19]) for (const sz of [-0.19, 0.19]) lc(g, sx, sz, 0.016, 0.019, 0, 0.43, F.oak, 10);
  lb(g, -0.22, 0.22, 0.42, 0.45, -0.22, 0.22, F.oak);
  ls(g, -0.2, 0.2, 0.45, 0.49, -0.18, 0.2, F.beige, 0.02);
  for (const sx of [-0.19, 0.19]) lc(g, sx, -0.205, 0.014, 0.014, 0.45, 0.8, F.oak, 10);
  ls(g, -0.21, 0.21, 0.64, 0.82, -0.225, -0.195, F.oak, 0.012);
  solid(g, -0.22, 0.22, -0.23, 0.23);
}
function armchair(X, Y, deg, mat, { high = false } = {}) {
  const g = grp(X, Y, deg), top = high ? 1.08 : 0.84;
  for (const sx of [-0.29, 0.29]) for (const sz of [-0.29, 0.29]) lc(g, sx, sz, 0.022, 0.014, 0, 0.17, F.oak, 10);
  ls(g, -0.37, 0.37, 0.16, 0.4, -0.37, 0.36, mat, 0.05);                     // Sockel
  ls(g, -0.29, 0.29, 0.39, 0.5, -0.22, 0.36, mat, 0.05);                     // Sitzkissen
  ls(g, -0.37, 0.37, 0.36, top, -0.38, -0.2, mat, 0.07);                    // Rücken
  for (const sx of [-1, 1]) ls(g, sx * 0.33 - 0.05, sx * 0.33 + 0.05, 0.36, 0.64, -0.36, 0.34, mat, 0.04);       // Armlehnen
  if (high) for (const sx of [-1, 1]) ls(g, sx * 0.335 - 0.045, sx * 0.335 + 0.045, 0.64, top - 0.04, -0.38, -0.12, mat, 0.04); // Ohren
  const pl = ls(g, -0.19, 0.19, 0.5, 0.8, -0.2, -0.08, F.linen, 0.05);
  pl.rotation.x = -0.25;
  solid(g, -0.39, 0.39, -0.38, 0.36);
}
function pillow(X, Y, deg, h0, mat, s = 0.44) {
  const g = grp(X, Y, deg);
  ls(g, -s / 2, s / 2, h0, h0 + s * 0.9, -0.07, 0.07, mat, 0.06).rotation.x = -0.28;
}
function floorLamp(X, Y) {
  pc(X, Y, 0.14, 0.15, 0, 0.025, F.black);
  pc(X, Y, 0.012, 0.012, 0.025, 1.42, F.brass, 8);
  pc(X, Y, 0.13, 0.2, 1.36, 1.62, F.shade, 32, false);
  psolid(X - 0.15, X + 0.15, Y - 0.15, Y + 0.15);
}
function plant(X, Y, s = 1, h0 = 0, solidIt = true) {
  pc(X, Y, 0.17 * s, 0.13 * s, h0, h0 + 0.36 * s, F.pot, 20);
  pc(X, Y, 0.155 * s, 0.155 * s, h0 + 0.33 * s, h0 + 0.345 * s, F.soil, 20, false);
  pc(X, Y, 0.015 * s, 0.02 * s, h0 + 0.34 * s, h0 + 0.85 * s, F.soil, 6);
  const L = [[0, 0, 0.78, 0.3, F.leaf], [0.13, 0.05, 0.98, 0.24, F.leaf2], [-0.12, 0.08, 1.08, 0.22, F.leaf], [0.04, -0.13, 1.2, 0.2, F.leaf2], [-0.04, -0.02, 1.36, 0.16, F.leaf]];
  for (const [dx, dy, h, r, mat] of L) psph(X + dx * s, Y + dy * s, h0 + h * s, r * s, mat).scale.set(1, 1.25, 1);
  if (solidIt) psolid(X - 0.2 * s, X + 0.2 * s, Y - 0.2 * s, Y + 0.2 * s);
}
function teddy(X, Y, deg, h0 = 0, s = 1, mat = F.teddy) {
  const g = grp(X, Y, deg);
  lsph(g, 0, h0 + 0.09 * s, 0, 0.09 * s, mat).scale.set(1, 1.1, 0.9);
  lsph(g, 0, h0 + 0.24 * s, 0.01 * s, 0.07 * s, mat);
  lsph(g, 0, h0 + 0.225 * s, 0.065 * s, 0.026 * s, F.beige);
  for (const sx of [-1, 1]) {
    lsph(g, sx * 0.05 * s, h0 + 0.3 * s, 0, 0.026 * s, mat);
    lsph(g, sx * 0.08 * s, h0 + 0.03 * s, 0.06 * s, 0.035 * s, mat);
    lsph(g, sx * 0.09 * s, h0 + 0.12 * s, 0.03 * s, 0.032 * s, mat);
  }
}
function books(x0, x1, Y, h0, mats, { alongY = false } = {}) {   // stehende Bücher
  let x = x0, i = 0;
  while (x < x1 - 0.03) {
    const t = 0.02 + rand() * 0.025, hh = 0.17 + rand() * 0.08, m = mats[i++ % mats.length];
    if (alongY) pb(Y - 0.08, Y + 0.08, x, x + t, h0, h0 + hh, m);
    else pb(x, x + t, Y - 0.08, Y + 0.08, h0, h0 + hh, m);
    x += t + 0.004;
  }
}

// --- Küche (laut Küchenplan): U-Form, Spüle am Fenster, Kochfeld an der TRH-Wand, Hochschränke am Flur ---
{
  const stoneTopTex = canvasTexture(512, 512, (g, w, h) => {
    g.fillStyle = '#554a47'; g.fillRect(0, 0, w, h);
    for (let k = 0; k < 9000; k++) {
      g.fillStyle = rand() > 0.5 ? `rgba(120,108,102,${0.15 + rand() * 0.25})` : `rgba(40,34,32,${0.15 + rand() * 0.25})`;
      g.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1 + rand() * 2);
    }
    for (let i = 0; i < 14; i++) {
      g.strokeStyle = `rgba(205,195,188,${0.08 + rand() * 0.22})`;
      g.lineWidth = 0.6 + rand() * 1.6;
      let x = rand() * w, y = rand() * h;
      g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 6; s++) { const nx = x + (rand() - 0.3) * 160, ny = y + (rand() - 0.5) * 120; g.quadraticCurveTo((x + nx) / 2 + (rand() - 0.5) * 60, (y + ny) / 2 + (rand() - 0.5) * 60, nx, ny); x = nx; y = ny; }
      g.stroke();
    }
  });
  const K = {
    front: std(0x8d9793, 0.7),
    gap: std(0x4d5552, 0.9),
    glass: std(0x101112, 0.15, { metalness: 0.2 }),
    sink: std(0x1d1d1e, 0.35),
    bowl: std(0x111112, 0.6),
    steel: M.rail,
    red: std(0x400000, 0.5, { emissive: 0xff3a1a, emissiveIntensity: 1.2 }),
    disp: std(0x101010, 0.4, { emissive: 0xd8e6ff, emissiveIntensity: 0.9 }),
  };
  const top = (x0, x1, y0, y1) =>
    pb(x0, x1, y0, y1, 0.88, 0.92, std(0xffffff, 0.45, { map: texFor(stoneTopTex, x1 - x0, y1 - y0, 1.0) }));
  // Seite einer Möbelzeile: u = entlang der Zeile, v = Abstand vor der Frontebene (v > 0 in den Raum)
  function side(along, f, dir) {
    return (u0, u1, v0, v1, h0, h1, mat, shadow = true) => {
      const a = f + dir * v0, b = f + dir * v1, c0 = Math.min(a, b), c1 = Math.max(a, b);
      return along === 'x' ? pb(u0, u1, c0, c1, h0, h1, mat, shadow) : pb(c0, c1, u0, u1, h0, h1, mat, shadow);
    };
  }
  // Stangengriff mit zwei kleinen Stützen
  function bar(B, u0, u1, h, mat = K.steel) {
    B(u0, u1, 0.028, 0.04, h - 0.006, h + 0.006, mat, false);
    for (const u of [u0 + 0.02, u1 - 0.03]) B(u, u + 0.01, 0.02, 0.028, h - 0.004, h + 0.004, mat, false);
  }
  // Frontfelder mit 4 mm Fugen; rows = Höhen von unten nach oben
  function fronts(B, u0, u1, h0, rows, { handle = 'bar', handleMat = K.steel } = {}) {
    B(u0, u1, -0.006, 0, h0, rows.reduce((s, r) => s + r, h0), K.gap, false);
    let h = h0;
    for (const r of rows) {
      B(u0 + 0.002, u1 - 0.002, 0, 0.02, h + 0.002, h + r - 0.002, K.front);
      if (handle === 'bar') bar(B, u0 + 0.06, u1 - 0.06, h + r - 0.05, handleMat);
      if (handle === 'grip') B(u0 + 0.03, u1 - 0.03, 0.02, 0.026, h + 0.004, h + 0.016, K.steel, false);
      h += r;
    }
  }
  const D3 = [0.26, 0.26, 0.26], D2 = [0.52, 0.26];
  // Unterschrank-Zeile: Korpus, weißer Sockel (zurückgesetzt), Fronten
  function baseRun(B, u0, u1, depth, segs) {
    B(u0, u1, -depth, -0.006, 0.10, 0.88, K.front);
    B(u0, u1, -depth + 0.02, -0.05, 0, 0.10, F.white);
    for (const [a, b, rows, opt] of segs) fronts(B, a, b, 0.10, rows, opt);
  }
  // Oberschrank mit 2 Klappen und Alu-Griffleiste unten
  function wallCab(B, u0, u1) {
    B(u0, u1, -0.35, -0.006, 1.45, 2.26, K.front);
    fronts(B, u0, u1, 1.45, [0.405, 0.405], { handle: 'grip' });
  }
  // Offenes Endregal (3 Fächer); wallSide = u-Seite, an der kein Schrank anschließt
  function openShelf(B, u0, u1, outer) {
    const t = 0.018;
    B(u0, u1, -0.35, -0.33, 1.45, 2.26, K.front);                          // Rückwand
    for (const h of [1.45, 1.72, 1.99, 2.26 - t]) B(u0, u1, -0.33, 0, h, h + t, K.front);
    if (outer === null) return;                                            // offene Seite ohne Seitenwand
    const s = outer === 0 ? u0 : u1 - t;
    B(s, s + t, -0.35, 0, 1.45, 2.26, K.front);                            // Außenseite
  }

  // ---- Zeile Süd (Spüle, Front nach Norden bei Y 8.97) ----
  const S = side('x', 8.97, -1);
  baseRun(S, 8.87, 11.20, 0.60, [[9.47, 10.10, D2], [10.10, 10.60, D2], [10.60, 11.20, D3]]);
  top(9.22, 11.20, 8.95, 9.57);
  top(8.87, 9.22, 8.95, 9.20);                                             // vor dem Pfeiler
  // Rückwand: unter Oberschrank/Regal hoch, unter dem Fenster nur bis zur Brüstung
  pb(9.22, 10.12, 9.555, 9.57, 0.92, 1.45, K.front, false);
  pb(10.12, 11.20, 9.555, 9.57, 0.92, 0.97, K.front, false);
  const SW = side('x', 9.22, -1);
  wallCab(SW, 9.22, 9.82);
  openShelf(SW, 9.82, 10.12, null);                                      // ohne linke Seitenwand
  // Granitspüle mit Abtropffläche nach Osten, Bogenarmatur (Spüle unter dem Fenster, Richtung Balkontür)
  const sx = 9.53;                                                         // Westkante der Spüle
  pb(sx, sx + 0.86, 9.04, 9.50, 0.92, 0.928, K.sink);
  pb(sx + 0.05, sx + 0.43, 9.09, 9.45, 0.928, 0.929, K.bowl, false);
  for (const y of [9.14, 9.22, 9.30, 9.38]) pb(sx + 0.50, sx + 0.80, y, y + 0.012, 0.928, 0.9285, K.bowl, false);
  const tx = sx + 0.49;                                                    // Armatur zwischen Becken und Abtropffläche
  pc(tx, 9.50, 0.022, 0.024, 0.928, 0.96, F.black, 16);
  rod([tx, 9.50, 0.95], [tx, 9.50, 1.27], 0.011, F.black);
  pc(tx, 9.50, 0.0125, 0.0125, 1.00, 1.01, K.red, 16, false);
  const arc = mk(new THREE.TorusGeometry(0.09, 0.011, 8, 24, Math.PI), F.black, P, wx(tx), 1.27, wz(9.41));
  arc.rotation.y = Math.PI / 2;
  rod([tx, 9.32, 1.27], [tx, 9.32, 1.19], 0.011, F.black);
  rod([tx + 0.03, 9.50, 1.03], [tx + 0.08, 9.50, 1.06], 0.006, F.black);    // Hebel
  psolid(8.87, 11.20, 8.95, 9.57);

  // ---- Zeile West (Kochfeld, Front nach Osten bei X 9.47) ----
  const W = side('y', 9.47, 1);
  baseRun(W, 6.35, 8.97, 0.60, [[6.95, 7.60, D3], [7.60, 8.40, D2], [8.40, 8.97, D3]]);
  top(8.87, 9.49, 6.35, 8.95);
  pb(8.87, 8.885, 6.35, 9.20, 0.92, 1.45, K.front, false);                 // Rückwand
  const WW = side('y', 9.22, 1);
  wallCab(WW, 8.40, 9.20);
  wallCab(WW, 7.60, 8.40);
  wallCab(WW, 6.35, 7.60);                                                // bis in die Ecke verlängert (ohne Regal)
  // Induktionskochfeld mit integriertem Dunstabzug
  pb(8.93, 9.43, 7.60, 8.40, 0.92, 0.926, K.glass);
  pb(9.00, 9.36, 7.965, 8.035, 0.926, 0.927, F.greyD, false);
  for (const x of [9.04, 9.12, 9.20, 9.28]) pb(x, x + 0.02, 7.97, 8.03, 0.927, 0.9275, K.gap, false);
  for (const y of [7.70, 7.80, 7.90, 8.10, 8.20, 8.30]) pb(9.37, 9.39, y, y + 0.02, 0.926, 0.927, K.red, false);
  psolid(8.87, 9.49, 6.35, 8.95);

  // ---- Hochschränke Nord (Front nach Süden bei Y 6.95), über die ganze Wand bis zum Durchgang ----
  const T = side('x', 6.95, 1);
  const tA = 9.47, tM = 10.215, tB = 10.96;                               // Backofensäule | Kühlschrank | Blende bis 10.98
  T(tA, tB, -0.60, -0.006, 0.10, 2.26, K.front);
  T(tA + 0.02, tB - 0.02, -0.58, -0.05, 0, 0.10, F.white);
  // Backofensäule: 2 Schubladen, Backofen, Kompaktbackofen (volle Korpusbreite), Oberschrank
  fronts(T, tA, tM, 0.10, [0.30, 0.30]);
  T(tA, tM, -0.006, 0, 0.70, 1.77, K.gap, false);
  const oc = (tA + tM) / 2, o0 = tA + 0.002, o1 = tM - 0.002;                // Geräte über die volle Korpusbreite
  T(o0, o1, 0, 0.025, 0.702, 1.318, K.glass);                              // Backofen
  T(o0 + 0.06, o1 - 0.06, 0.025, 0.027, 0.78, 1.18, K.bowl, false);
  bar(T, o0 + 0.06, o1 - 0.06, 1.23);
  T(o0, o1, 0, 0.025, 1.322, 1.768, K.glass);                              // Kompaktbackofen
  T(oc - 0.04, oc + 0.04, 0.025, 0.027, 1.70, 1.73, K.disp, false);
  T(o0 + 0.06, o1 - 0.06, 0.025, 0.027, 1.39, 1.64, K.bowl, false);
  fronts(T, tA, tM, 1.77, [0.49], { handle: 'none' });
  // Kühl-Gefrier-Kombination
  fronts(T, tM, tB, 0.10, [0.88, 1.28], { handle: 'none' });
  bar(T, tM + 0.06, tB - 0.06, 0.93);
  bar(T, tM + 0.06, tB - 0.06, 1.04);
  pb(tB, 10.98, 6.35, 6.97, 0, 2.26, F.white);                             // Seitenblende am Durchgang
  psolid(tA, 10.98, 6.35, 6.97);

  // ---- Sideboard am Kamin, so tief wie der Kamin (X 11.69–12.45), Front nach Westen ----
  const SB = side('y', 11.71, -1);
  baseRun(SB, 6.95, 8.35, 0.74, [[6.95, 7.65, D3, { handleMat: F.black }], [7.65, 8.35, D3, { handleMat: F.black }]]);   // 1,40 m breit
  top(11.69, 12.45, 6.95, 8.35);
  pb(12.444, 12.452, 6.95, 8.35, 0, 0.88, F.white);                         // Rückseite zum Essbereich weiß
  pb(12.02, 12.12, 6.95, 7.05, 0.92, 1.16, F.black);                       // Steckdosenturm mittig am Kamin, Steckdosen nach Süden
  for (const h of [0.98, 1.045, 1.11]) {
    const s = pc(12.07, 7.052, 0.028, 0.028, h - 0.004, h + 0.004, F.greyD, 20, false);
    s.rotation.x = Math.PI / 2; s.position.y = h;
  }
  psolid(11.69, 12.45, 6.95, 8.35);
}

// --- Vorhang ---------------------------------------------------------------------
const CUR = { x: 10.50, ySouth: 4.55, Lclosed: 4.13, Lopen: 0.42, folds: 22, cols: 240 };
aabb(CUR.x - 0.02, CUR.x + 0.02, 0.42, CUR.ySouth, H - 0.04, H, M.rail, { solid: false, shadow: false });
const curtainGeo = new THREE.PlaneGeometry(1, 1, CUR.cols, 1);
const curtain = new THREE.Mesh(curtainGeo, M.curtain);
curtain.receiveShadow = false;   // ohne Decke: kein Eigenschatten (sonst flach grau); mit Decke: wie der Raum verschattet
curtain.castShadow = true;
// Stoff lässt Licht durch: feines Zufallsraster → nur ein Teil des Vorhangs landet in der
// Shadow-Map, die weiche PCF-Filterung mittelt das zu einem leichten Schatten.
const curtainDither = canvasTexture(64, 64, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = rand() < 0.5 ? 255 : 0;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  g.putImageData(img, 0, 0);
});
curtainDither.colorSpace = THREE.NoColorSpace;
curtainDither.magFilter = curtainDither.minFilter = THREE.NearestFilter;
curtainDither.generateMipmaps = false;
curtainDither.repeat.set(70, 45);
curtain.customDepthMaterial = new THREE.MeshDepthMaterial({
  depthPacking: THREE.RGBADepthPacking, alphaMap: curtainDither, alphaTest: 0.5, side: THREE.DoubleSide,
});
scene.add(curtain);
let curtainT = 0, curtainTarget = 0;  // 0 = zu, 1 = auf
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function updateCurtain() {
  const k = ease(curtainT);
  const L = CUR.Lclosed + (CUR.Lopen - CUR.Lclosed) * k;
  const A = 0.035 + 0.075 * k;
  const pos = curtainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const col = i % (CUR.cols + 1), row = Math.floor(i / (CUR.cols + 1));
    const u = col / CUR.cols;                 // 0 = Nordkante (beweglich), 1 = Südkante (fest)
    const Y = CUR.ySouth - L * (1 - u);
    const off = A * Math.sin(u * CUR.folds * 2 * Math.PI);
    pos.setXYZ(i, wx(CUR.x) + off, row === 0 ? H - 0.05 : 0.02, wz(Y));
  }
  pos.needsUpdate = true;
  curtainGeo.computeVertexNormals();
  curtainGeo.computeBoundingSphere();
}
updateCurtain();

// --- Raum-Labels -----------------------------------------------------------------
const rooms = [
  ['Kinder', '16,33 m²', 1.98, 2.7],

];

for (const [name, area, X, Y] of rooms) {

// Im Rundgang: Labels hinter Wänden ausblenden
const occluders = [];
scene.traverse(o => { if (o.isMesh && (o.material === wallMats || o.material === woodMats)) occluders.push(o); });
occluders.push(curtain);
const ray = new THREE.Raycaster(), tmpV = new THREE.Vector3();
let occlTimer = 0;
function updateLabelOcclusion(dt) {
  occlTimer -= dt;
  if (occlTimer > 0) return;
  occlTimer = 0.15;
  for (const l of labels) {
    let hidden = false;
    if (mode === 'walk' && ceiling.visible) {
      tmpV.subVectors(l.position, camera.position);
      const dist = tmpV.length();
      ray.set(camera.position, tmpV.normalize());
      ray.far = dist - 0.05;
      hidden = ray.intersectObjects(occluders, false).length > 0;
    }
    l.element.style.opacity = hidden ? '0' : '1';
  }
}

// --- Rundgang (Ego-Perspektive) ------------------------------------------------------
const plc = new PointerLockControls(camera, renderer.domElement);
const overlay = document.getElementById('walkOverlay');
const crosshair = document.getElementById('crosshair');
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (mode === 'walk' && e.code.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
// Vollbild für den Rundgang (Fehler/fehlende Unterstützung still ignorieren)
const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
function enterFullscreen() {
  if (fsElement()) return;
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen?.();
    p?.catch?.(() => {});
  } catch (e) {}
}
function exitFullscreen() {
  if (!fsElement()) return;
  try {
    const p = document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen?.();
    p?.catch?.(() => {});
  } catch (e) {}
}
// Kein Rundgang auf Touch-Geräten (Handy/Tablet)
const touchMQ = matchMedia('(hover: none) and (pointer: coarse)');
let isTouch = touchMQ.matches;
function applyTouch() {
  isTouch = touchMQ.matches;
  document.querySelector('#modes [data-mode="walk"]').hidden = isTouch;
  if (isTouch && mode === 'walk') setMode('orbit');
}
touchMQ.addEventListener?.('change', applyTouch);
overlay.addEventListener('click', () => { plc.lock(); enterFullscreen(); });
plc.addEventListener('lock', () => { overlay.style.display = 'none'; crosshair.style.display = 'block'; });
plc.addEventListener('unlock', () => { if (mode === 'walk') overlay.style.display = 'flex'; crosshair.style.display = 'none'; });

const RADIUS = 0.22, EYE = 1.65;
function collide(p) {
  for (let it = 0; it < 3; it++) {
    for (const s0 of solids) {
      if (s0.furn && !furniture.visible) continue;
      const s = s0.door ? doorBox(s0.door) : s0;
      const dx = p.x - s.cx, dz = p.z - s.cz, c = Math.cos(s.a), sn = Math.sin(s.a);
      const lx = dx * c - dz * sn, lz = dx * sn + dz * c;
      const qx = Math.max(-s.hx, Math.min(s.hx, lx)), qz = Math.max(-s.hz, Math.min(s.hz, lz));
      let ex = lx - qx, ez = lz - qz, d = Math.hypot(ex, ez);
      let px, pz;
      if (d > 1e-6) {
        if (d >= RADIUS) continue;
        px = ex / d * (RADIUS - d); pz = ez / d * (RADIUS - d);
      } else {
        const ox = s.hx - Math.abs(lx), oz = s.hz - Math.abs(lz);
        if (ox < oz) { px = Math.sign(lx || 1) * (ox + RADIUS); pz = 0; }
        else { px = 0; pz = Math.sign(lz || 1) * (oz + RADIUS); }
      }
      p.x += px * c + pz * sn;
      p.z += -px * sn + pz * c;
    }
  }
}
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function walkStep(dt) {
  let f = 0, r = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) r += 1;
  if (keys.KeyA || keys.ArrowLeft) r -= 1;
  if (!f && !r) return;
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, camera.up).normalize();
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.4 : 1.6) * dt / Math.hypot(f, r);
  camera.position.addScaledVector(fwd, f * speed).addScaledVector(right, r * speed);
  collide(camera.position);
  camera.position.y = EYE;
}

// --- Modi & UI ---------------------------------------------------------------------
let mode = 'orbit', tween = null, ceilingBeforeWalk = false, orbitSaved = null;
const chkCeil = document.getElementById('chkCeil');
const chkLabels = document.getElementById('chkLabels');
const btnCurtain = document.getElementById('btnCurtain');
const help = document.getElementById('help');
const HELP = {
  orbit: 'Linke Maustaste: drehen · Rechte Maustaste: verschieben · Mausrad: zoomen · Klick auf Tür: öffnen/schließen',
  top: 'Linke Maustaste: drehen · Rechte Maustaste: verschieben · Mausrad: zoomen · Klick auf Tür: öffnen/schließen',
  walk: 'Rundgang: W A S D gehen · Maus umsehen · Klick oder E auf Tür: öffnen/schließen · Esc Pause · „3D“ beendet',
};
function flyTo(pos, target, dur = 1.0) {
  tween = { t: 0, dur, p0: camera.position.clone(), p1: pos.clone(), t0: orbit.target.clone(), t1: target.clone() };
}
function setCeiling(v) { ceiling.visible = v; chkCeil.checked = v; curtain.receiveShadow = v; }
function setMode(m) {
  if (m === mode && m !== 'top') return;
  if (m === 'walk' && isTouch) return;
  const prev = mode;
  if (prev === 'walk' && m !== 'walk') {
    plc.unlock();
    exitFullscreen();
    overlay.style.display = 'none';
    setCeiling(ceilingBeforeWalk);
    camera.position.copy(orbitSaved.pos);
    orbit.target.copy(orbitSaved.target);
    orbit.enabled = true;
    orbit.update();
  }
  mode = m;
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  help.textContent = HELP[m];
  if (m === 'walk') {
    tween = null;
    orbitSaved = { pos: camera.position.clone(), target: orbit.target.clone() };
    orbit.enabled = false;
    ceilingBeforeWalk = ceiling.visible;
    setCeiling(true);
    camera.position.set(wx(4.4), EYE, wz(5.45));
    camera.lookAt(wx(11), EYE - 0.1, wz(5.45));
    overlay.style.display = 'flex';
    enterFullscreen();
  } else if (m === 'top') {
    flyTo(new THREE.Vector3(0, 19, 0.6), new THREE.Vector3(0, 0, 0.3));
  } else if (prev === 'top') {
    flyTo(HOME.pos, HOME.target);
  }
}
document.querySelectorAll('#modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.getElementById('btnReset').addEventListener('click', () => {
  if (mode === 'walk') setMode('orbit');
  mode = 'orbit';
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === 'orbit'));
  help.textContent = HELP.orbit;
  flyTo(HOME.pos, HOME.target);
});
btnCurtain.addEventListener('click', () => {
  curtainTarget = curtainTarget ? 0 : 1;
  btnCurtain.textContent = curtainTarget ? 'Vorhang schließen' : 'Vorhang öffnen';
});
const btnFurn = document.getElementById('btnFurn');
btnFurn.addEventListener('click', () => {
  furniture.visible = !furniture.visible;
  btnFurn.textContent = furniture.visible ? 'Möbel ausblenden' : 'Möbel einblenden';
});
// Bedienfeld nach links ein-/ausfahren (Zustand bleibt beim Neuladen erhalten)
const panel = document.getElementById('panel');
const btnHide = document.getElementById('btnHide'), btnShow = document.getElementById('btnShow');
function setPanel(collapsed, { focus = true } = {}) {
  panel.classList.toggle('collapsed', collapsed);
  document.body.classList.toggle('panel-collapsed', collapsed);
  panel.inert = collapsed;
  btnShow.inert = !collapsed;
  if (focus) (collapsed ? btnShow : btnHide).focus({ preventScroll: true });
  try { localStorage.setItem('wohnung.panelCollapsed', collapsed ? '1' : '0'); } catch (e) {}
}
btnHide.addEventListener('click', () => setPanel(true));
btnShow.addEventListener('click', () => setPanel(false));
let panelStart = false;
try { panelStart = localStorage.getItem('wohnung.panelCollapsed') === '1'; } catch (e) {}
setPanel(panelStart, { focus: false });
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('preload')));
chkCeil.addEventListener('change', () => { setCeiling(chkCeil.checked); });
chkLabels.addEventListener('change', () => { labelRenderer.domElement.style.display = chkLabels.checked ? '' : 'none'; });
help.textContent = HELP.orbit;
applyTouch();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// --- Türen anklicken ------------------------------------------------------------------
const pickRay = new THREE.Raycaster(), ndc = new THREE.Vector2();
let aimTimer = 0, downPos = null;
function pickDoor(clientX, clientY, center = false) {
  if (center) ndc.set(0, 0);
  else ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  pickRay.setFromCamera(ndc, camera);
  pickRay.far = center ? 3.0 : Infinity;
  const pickables = furniture.visible ? [...doorPick, ...swingPick, ...occluders] : [...doorPick, ...occluders];
  const hits = pickRay.intersectObjects(pickables, false);
  if (!hits.length) return null;
  const u = hits[0].object.userData;
  return u.door || (u.swing ? 'swing' : null);
}
function activate(d) {
  if (d === 'swing') { SWING.A = THREE.MathUtils.degToRad(25); SWING.t = 0; }
  else if (d) toggleDoor(d);
}
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (mode === 'walk' || !downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;
  const d = pickDoor(e.clientX, e.clientY);
  activate(d);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode === 'walk' || e.buttons) return;
  renderer.domElement.style.cursor = pickDoor(e.clientX, e.clientY) ? 'pointer' : '';
});
document.addEventListener('mousedown', () => {
  if (mode === 'walk' && plc.isLocked) { const d = pickDoor(0, 0, true); activate(d); }
});
addEventListener('keydown', e => {
  if (e.code === 'KeyE' && mode === 'walk') { const d = pickDoor(0, 0, true); activate(d); }
});

// --- Render-Loop ---------------------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (curtainT !== curtainTarget) {
    const step = dt / 1.2;
    curtainT = curtainTarget > curtainT ? Math.min(curtainTarget, curtainT + step) : Math.max(curtainTarget, curtainT - step);
    updateCurtain();
  }
  if (mode === 'walk') {
    walkStep(dt);
  } else {
    if (tween) {
      tween.t += dt;
      const k = ease(Math.min(1, tween.t / tween.dur));
      camera.position.lerpVectors(tween.p0, tween.p1, k);
      orbit.target.lerpVectors(tween.t0, tween.t1, k);
      if (k >= 1) tween = null;
    }
    orbit.update();
  }
  for (const d of doors) {
    if (d.t === d.target) continue;
    const step = dt / 0.7;
    d.t = d.target > d.t ? Math.min(d.target, d.t + step) : Math.max(d.target, d.t - step);
    d.pivot.rotation.y = d.a0 + d.delta * ease(d.t);
  }
  if (SWING.A > 0 && swing.group) {   // gedämpftes Pendel
    SWING.t += dt;
    const amp = SWING.A * Math.exp(-SWING.t / SWING.tau);
    swing.group.rotation.z = amp * Math.sin(SWING.w * SWING.t);
    if (amp < 0.002) { SWING.A = 0; swing.group.rotation.z = 0; }
  }
  if (mode === 'walk' && plc.isLocked) {
    aimTimer -= dt;
    if (aimTimer <= 0) { aimTimer = 0.1; crosshair.classList.toggle('hot', !!pickDoor(0, 0, true)); }
  }
  updateLabelOcclusion(dt);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// Für Tests/Debugging
window.__app = { scene, camera, orbit, setMode, solids, doors, toggleDoor, furniture, collide, swing, SWING, activate, curtain, get isTouch() { return isTouch; } };
