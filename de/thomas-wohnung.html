<title>Wohnung Thomas – 3D</title>
<style>
  :root { --ink:#1d2026; --muted:#6b7280; --line:#e3e5e8; --accent:#1f6feb; }
  html, body { margin:0; height:100%; overflow:hidden; background:#eceff2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; }
  #labels { position:absolute; inset:0; pointer-events:none; z-index:1; }   /* eigener Stapelkontext: Labels unter dem Panel */
  .label { text-align:center; line-height:1.15; padding:4px 8px; border-radius:7px; background:rgba(255,255,255,.82); box-shadow:0 1px 4px rgba(0,0,0,.12); backdrop-filter: blur(3px); white-space:nowrap; }
  .label b { display:block; font-size:13px; font-weight:650; }
  .label span { display:block; font-size:11px; color:var(--muted); }
  #panel { position:absolute; top:16px; left:16px; width:236px; padding:14px 14px 12px; border-radius:12px; background:rgba(255,255,255,.92); box-shadow:0 4px 20px rgba(0,0,0,.12); backdrop-filter: blur(6px); font-size:13px; z-index:5; }
  #panel { transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s; }
  #panel.collapsed { transform: translateX(calc(-100% - 24px)); opacity:0; pointer-events:none; }
  #panel h1 { font-size:15px; margin:0 0 2px; padding-right:32px; }
  .icon-btn { position:absolute; top:10px; right:10px; width:28px; height:28px; display:grid; place-items:center; padding:0; border:0; border-radius:8px; background:transparent; color:var(--muted); cursor:pointer; }
  .icon-btn:hover { background:#f4f5f7; color:var(--ink); }
  .icon-btn svg, #btnShow svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #btnShow { position:absolute; top:16px; left:0; width:28px; height:44px; display:grid; place-items:center; padding:0; border:0; border-radius:0 10px 10px 0; background:rgba(255,255,255,.92); box-shadow:0 4px 20px rgba(0,0,0,.12); backdrop-filter: blur(6px); color:var(--ink); cursor:pointer; z-index:5;
             opacity:0; transform:translateX(-100%); pointer-events:none; transition: transform .26s cubic-bezier(.2,.8,.2,1), opacity .26s; }
  #btnShow:hover { background:#fff; }
  body.panel-collapsed #btnShow { opacity:1; transform:none; pointer-events:auto; transition-delay:.12s; }
  body.preload #panel, body.preload #btnShow { transition:none !important; }
  @media (prefers-reduced-motion: reduce) { #panel, #btnShow { transition:none !important; } }
  #panel .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .gl { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:10px 0 6px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { flex:1; border:0; border-right:1px solid var(--line); background:#fff; padding:7px 0; font:inherit; font-size:12px; cursor:pointer; }
  .seg button:last-child { border-right:0; }
  .seg button.active { background:var(--ink); color:#fff; }
  .btn { width:100%; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px; font:inherit; cursor:pointer; margin-bottom:6px; }
  .btn:hover, .seg button:not(.active):hover { background:#f4f5f7; }
  .btn.primary { background:#f7f3ea; border-color:#e4dccb; }
  .tog { display:flex; align-items:center; gap:8px; padding:4px 0; cursor:pointer; }
  #help { position:absolute; left:16px; bottom:16px; max-width:calc(100% - 32px); padding:8px 12px; border-radius:9px; background:rgba(255,255,255,.85); font-size:12px; color:var(--muted); z-index:5; }
  #walkOverlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,22,26,.35); z-index:4; cursor:pointer; }
  #walkOverlay > div { background:#fff; padding:18px 24px; border-radius:12px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.2); max-width:320px; }
  #walkOverlay b { font-size:16px; }
  #walkOverlay p { margin:8px 0 0; font-size:13px; color:var(--muted); }
  #crosshair { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(0,0,0,.35); display:none; z-index:4; pointer-events:none; }
  #crosshair.hot { width:12px; height:12px; margin:-6px 0 0 -6px; background:#ffd75e; }
  @media (max-width: 600px) { #panel { width:auto; right:16px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body class="preload">
<div id="panel">
  <button id="btnHide" class="icon-btn" aria-label="Bedienfeld ausblenden" title="Bedienfeld ausblenden">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ---------------------------------------------------------------------------
// Koordinaten: Plan-X = Ost (m ab linker Außenkante), Plan-Y = Süd (m ab oberer
// Außenkante). three: x = X - OX, z = Y - OZ, y = Höhe. Norden = -z.
// ---------------------------------------------------------------------------
const H = 3.05, OX = 4.35, OZ = 5.49;
const wx = X => X - OX, wz = Y => Y - OZ;

// --- Renderer / Szene -------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.id = 'labels';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceff2);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 200);
const HOME = { pos: new THREE.Vector3(2.5, 14.5, 12.5), target: new THREE.Vector3(0, 0, 0.4) };
camera.position.copy(HOME.pos);

const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.copy(HOME.target);
orbit.enableDamping = true;
orbit.minDistance = 1.5;
orbit.maxDistance = 45;
orbit.maxPolarAngle = THREE.MathUtils.degToRad(88);
orbit.update();

// --- Licht -------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xffffff, 0xcfc6b8, 1.5));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.0);
sun.position.set(7, 16, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -13, right: 13, top: 13, bottom: -13, near: 1, far: 50 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// --- Texturen ----------------------------------------------------------------
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Eichenparkett: 8 Dielenreihen pro Kachel (Kachel = 1,44 m)
const woodTex = canvasTexture(1024, 1024, (g, w, h) => {
  const rows = 8, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * w * 0.5;
    while (x < w) {
      const len = w * (0.3 + rand() * 0.45);
      const l = 66 + rand() * 9;
      for (const off of [0, -w, w]) {
        g.fillStyle = `hsl(${30 + rand() * 6}, ${36 + rand() * 10}%, ${l}%)`;
        g.fillRect(x + off, r * rh, len, rh);
        g.strokeStyle = 'rgba(110,70,35,.10)';
        g.lineWidth = 1;
        for (let k = 0; k < 6; k++) {
          const yy = r * rh + 6 + rand() * (rh - 12);
          g.beginPath(); g.moveTo(x + off, yy);
          g.bezierCurveTo(x + off + len * .3, yy + (rand() - .5) * 8, x + off + len * .7, yy + (rand() - .5) * 8, x + off + len, yy);
          g.stroke();
        }
        g.fillStyle = 'rgba(90,60,30,.35)';
        g.fillRect(x + off + len - 1.5, r * rh, 1.5, rh);
      }
      x += len;
    }
    g.fillStyle = 'rgba(90,60,30,.35)';
    g.fillRect(0, r * rh, w, 1.5);
  }
});
// Dunkle Granitfliesen 60 × 60 cm (Kachel = 1,2 m)
const tileTex = canvasTexture(1024, 1024, (g, w, h) => {
  const n = 2, s = w / n;
  g.fillStyle = '#3b3c3e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x0 = i * s + 2, y0 = j * s + 2, ss = s - 4;
    g.fillStyle = `hsl(220, 4%, ${21 + rand() * 4}%)`;
    g.fillRect(x0, y0, ss, ss);
    for (let k = 0; k < 9000; k++) {
      const r = rand();
      g.fillStyle = r < 0.45 ? `rgba(0,0,0,${0.3 + rand() * 0.4})`
                  : r < 0.85 ? `rgba(105,106,112,${0.2 + rand() * 0.35})`
                  : `rgba(215,215,222,${0.25 + rand() * 0.5})`;
      const sz = 1 + rand() * 3;
      g.fillRect(x0 + rand() * (ss - sz), y0 + rand() * (ss - sz), sz, sz);
    }
  }
});
// Steinplatten (Kachel = 1,2 m)
const stoneTex = canvasTexture(512, 512, (g, w, h) => {
  const n = 2, s = w / n;
  g.fillStyle = '#8f8a82'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    g.fillStyle = `hsl(35, 8%, ${62 + rand() * 6}%)`;
    g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    for (let k = 0; k < 400; k++) {
      g.fillStyle = `rgba(${rand() > .5 ? '255,255,255' : '60,55,50'},.06)`;
      g.fillRect(i * s + rand() * s, j * s + rand() * s, 3, 3);
    }
  }
});
function texFor(base, w, d, tile) {
  const t = base.clone();
  t.repeat.set(w / tile, d / tile);
  t.needsUpdate = true;
  return t;
}

// --- Materialien ---------------------------------------------------------------
const M = {
  wall:   new THREE.MeshStandardMaterial({ color: 0xf4f2ed, roughness: 0.92 }),
  cut:    new THREE.MeshStandardMaterial({ color: 0x2a2b2e, roughness: 0.8 }),
  frame:  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }),
  sill:   new THREE.MeshStandardMaterial({ color: 0xe9e6df, roughness: 0.6 }),
  door:   new THREE.MeshStandardMaterial({ color: 0xfbfbf9, roughness: 0.55 }),
  glass:  new THREE.MeshPhysicalMaterial({ color: 0xcfe6f2, roughness: 0.05, transparent: true, opacity: 0.22, depthWrite: false }),
  frosted:new THREE.MeshStandardMaterial({ color: 0xf7f9f9, roughness: 1, transparent: true, opacity: 0.92, emissive: 0x3a3a38 }),
  wood:   new THREE.MeshStandardMaterial({ color: 0xa8743f, roughness: 0.7 }),
  metal:  new THREE.MeshStandardMaterial({ color: 0x4d5054, roughness: 0.4, metalness: 0.6 }),
  slab:   new THREE.MeshStandardMaterial({ color: 0xb9b6b0, roughness: 0.9 }),
  stair:  new THREE.MeshStandardMaterial({ color: 0xd8ccb6, roughness: 0.7 }),
  ceil:   new THREE.MeshStandardMaterial({ color: 0xfafaf8, roughness: 0.95, side: THREE.DoubleSide }),
  rail:   new THREE.MeshStandardMaterial({ color: 0xc9ccd0, roughness: 0.35, metalness: 0.7 }),
};
// Box-Materialreihenfolge: +x, -x, +y (Oberseite = Schnittfläche dunkel), -y, +z, -z
const wallMats = [M.wall, M.wall, M.cut, M.wall, M.wall, M.wall];
const woodMats = [M.wood, M.wood, M.cut, M.wood, M.wood, M.wood];

// --- Bau-Helfer ------------------------------------------------------------------
const solids = [];            // Kollisionsboxen für den Rundgang
const ceiling = new THREE.Group();
scene.add(ceiling);

function boxAt(cx, cz, lx, lz, h0, h1, mat, angle = 0, { solid = true, shadow = true, parent = scene } = {}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(lx, h1 - h0, lz), mat);
  m.position.set(cx, (h0 + h1) / 2, cz);
  m.rotation.y = angle;
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  if (solid && h0 < 1.0) solids.push({ cx, cz, hx: lx / 2, hz: lz / 2, a: angle });
  return m;
}
const aabb = (x0, x1, y0, y1, h0, h1, mat, opts) =>
  boxAt(wx((x0 + x1) / 2), wz((y0 + y1) / 2), x1 - x0, y1 - y0, h0, h1, mat, 0, opts);

// Wand von a nach b (Plan-Koordinaten, Mittellinie), Dicke t, Öffnungen entlang der Wand (s0..s1 in m ab a)
function wall(a, b, t, ops = []) {
  const ax = wx(a[0]), az = wz(a[1]), bx = wx(b[0]), bz = wz(b[1]);
  const dx = bx - ax, dz = bz - az, L = Math.hypot(dx, dz);
  const ux = dx / L, uz = dz / L, ang = Math.atan2(-dz, dx);
  const at = s => [ax + ux * s, az + uz * s];
  const seg = (s0, s1, h0, h1) => {
    if (s1 - s0 < 0.005 || h1 - h0 < 0.005) return;
    const [cx, cz] = at((s0 + s1) / 2);
    boxAt(cx, cz, s1 - s0, t, h0, h1, wallMats, ang);
  };
  ops = ops.map(o => o.full ? { ...o, s0: 0, s1: L } : o).sort((p, q) => p.s0 - q.s0);
  let cur = 0;
  for (const o of ops) {
    const sill = o.sill ?? 0, head = o.head ?? 2.05;
    seg(cur, o.s0, 0, H);
    seg(o.s0, o.s1, 0, sill);
    seg(o.s0, o.s1, head, H);
    if (o.kind === 'door') doorFrame(at, ang, o.s0, o.s1, head, t);
    else windowParts(at, ang, o.s0, o.s1, sill, head, t, o.kind, o.noSill);
    cur = o.s1;
  }
  seg(cur, L, 0, H);
}
function windowParts(at, ang, s0, s1, sill, head, t, kind, noSill = false) {
  const len = s1 - s0, [cx, cz] = at((s0 + s1) / 2), f = 0.06, fd = Math.min(0.08, t);
  const eps = sill > 0.1 && !noSill ? 0.008 : 0;   // Fensterbank minimal über der Brüstung (kein Z-Fighting)
  const nos = { solid: false };
  boxAt(cx, cz, len, 0.02, sill, head, kind === 'frosted' ? M.frosted : M.glass, ang, { solid: true, shadow: false });
  const [lx, lz] = at(s0 + f / 2), [rx, rz] = at(s1 - f / 2);
  boxAt(lx, lz, f, fd, sill, head, M.frame, ang, nos);
  boxAt(rx, rz, f, fd, sill, head, M.frame, ang, nos);
  boxAt(cx, cz, len, fd, head - f, head, M.frame, ang, nos);
  boxAt(cx, cz, len, fd, sill + eps, sill + eps + f, M.frame, ang, nos);
  if (len > 1.1) boxAt(cx, cz, f * 0.8, fd, sill, head, M.frame, ang, nos);
  if (eps) boxAt(cx, cz, len + 0.06, t + 0.06, sill - 0.03, sill + eps, M.sill, ang, nos);
}
function doorFrame(at, ang, s0, s1, head, t) {
  const fw = 0.04, [cx, cz] = at((s0 + s1) / 2);
  const [lx, lz] = at(s0 + fw / 2), [rx, rz] = at(s1 - fw / 2);
  const nos = { solid: false };
  boxAt(lx, lz, fw, t + 0.02, 0, head, M.frame, ang, nos);
  boxAt(rx, rz, fw, t + 0.02, 0, head, M.frame, ang, nos);
  boxAt(cx, cz, s1 - s0, t + 0.02, head - fw, head, M.frame, ang, nos);
}
// horizontale / vertikale Wand: Band y0..y1 bzw. x0..x1, Öffnungen in absoluten Plan-Koordinaten
const hWall = (y0, y1, x0, x1, ops = []) =>
  wall([x0, (y0 + y1) / 2], [x1, (y0 + y1) / 2], y1 - y0, ops.map(o => ({ ...o, s0: o.from - x0, s1: o.to - x0 })));
const vWall = (x0, x1, y0, y1, ops = []) =>
  wall([(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1], x1 - x0, ops.map(o => ({ ...o, s0: o.from - y0, s1: o.to - y0 })));
const Win  = (a, b, sill = 0.9, head = 2.40) => ({ from: a, to: b, sill, head, kind: 'window' });
const Door = (a, b, head = 2.05) => ({ from: a, to: b, sill: 0, head, kind: 'door' });

// Drehtür: Scharnier, Spitze im geschlossenen Zustand, Richtung im geöffneten Zustand (Plan-Koordinaten)
const doors = [], doorPick = [];
function door(hinge, closedTip, openTip, { glass = false, open = false } = {}) {   // Türen starten geschlossen
  const hx = wx(hinge[0]), hz = wz(hinge[1]);
  const cdx = wx(closedTip[0]) - hx, cdz = wz(closedTip[1]) - hz;
  const L = Math.hypot(cdx, cdz) - 0.02;
  const a0 = Math.atan2(-cdz, cdx);
  const a1 = Math.atan2(-(wz(openTip[1]) - hz), wx(openTip[0]) - hx);
  let delta = a1 - a0;
  while (delta > Math.PI) delta -= 2 * Math.PI;
  while (delta < -Math.PI) delta += 2 * Math.PI;
  const pivot = new THREE.Group();
  pivot.position.set(hx, 0, hz);
  scene.add(pivot);
  const d = { pivot, a0, delta, L, hx, hz, glass, t: open ? 1 : 0, target: open ? 1 : 0 };
  const part = (lx, ly, lz, px, py, mat, shadow = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(lx, ly, lz), mat);
    m.position.set(px, py, 0);
    m.castShadow = shadow;
    m.receiveShadow = true;
    m.userData.door = d;
    pivot.add(m);
    doorPick.push(m);
  };
  const top = 2.02, bot = 0.01, mid = (top + bot) / 2;
  if (glass) {
    const f = 0.08, b = 0.14;
    part(f, top - bot, 0.045, f / 2, mid, M.door);
    part(f, top - bot, 0.045, L - f / 2, mid, M.door);
    part(L - 2 * f, f, 0.045, L / 2, top - f / 2, M.door);
    part(L - 2 * f, b, 0.045, L / 2, bot + b / 2, M.door);
    part(L - 2 * f, top - f - bot - b, 0.02, L / 2, (bot + b + top - f) / 2, M.frosted, false);
  } else {
    part(L, top - bot, 0.04, L / 2, mid, M.door);
  }
  part(0.12, 0.03, 0.12, L - 0.08, 1.05, M.metal, false);   // Türgriff beidseitig
  pivot.rotation.y = a0 + delta * d.t;
  doors.push(d);
  solids.push({ door: d });
}
const toggleDoor = d => { d.target = d.target ? 0 : 1; };
function doorBox(d) {
  const a = d.pivot.rotation.y;
  return { cx: d.hx + Math.cos(a) * d.L / 2, cz: d.hz - Math.sin(a) * d.L / 2, hx: d.L / 2, hz: 0.03, a };
}
function floor(x0, x1, y0, y1, tex, tile, y = 0, roughness = 0.75) {
  const w = x1 - x0, d = y1 - y0;
  const mat = new THREE.MeshStandardMaterial({ map: texFor(tex, w, d, tile), roughness });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2;
  m.position.set(wx((x0 + x1) / 2), y, wz((y0 + y1) / 2));
  m.receiveShadow = true;
  scene.add(m);
}

// --- Umriss, Bodenplatte, Umgebung --------------------------------------------------
const OUTLINE = [[-0.70, -0.74], [7.72, -0.74], [7.72, 2.10], [9.39, 2.10], [9.39, 7.32], [7.82, 7.32], [7.82, 11.72], [-0.70, 11.72]];
const HOLE = { x0: 7.10, x1: 8.37, y0: 4.69, y1: 6.50 };   // Treppenöffnung

// Fläche aus Plan-Punkten. up = true: für rotation.x = -90° (Normale nach oben), sonst für +90° (wie die Decke)
function planShape(pts, holes = [], up = true) {
  const v = ([X, Y]) => new THREE.Vector2(wx(X), up ? -wz(Y) : wz(Y));
  const s = new THREE.Shape(pts.map(v));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(v)));
  return s;
}

// --- Helfer: lokal (Gruppe) ---------------------------------------------------------
function mk(geo, mat, parent, x, y, z, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Gruppe an Plan-Position; deg = Blickrichtung: 0 = Süd, 90 = Ost, 180 = Nord, -90 = West (lokal +z = vorne)
function grp(X, Y, deg = 0) {
  const g = new THREE.Group();
  g.position.set(wx(X), 0, wz(Y));
  g.rotation.y = THREE.MathUtils.degToRad(deg);
  furniture.add(g);
  return g;
}
const lb = (p, x0, x1, h0, h1, z0, z1, mat, shadow = true) =>
  mk(new THREE.BoxGeometry(x1 - x0, h1 - h0, z1 - z0), mat, p, (x0 + x1) / 2, (h0 + h1) / 2, (z0 + z1) / 2, shadow);
function ls(p, x0, x1, h0, h1, z0, z1, mat, r = 0.04) {
  const w = x1 - x0, h = h1 - h0, d = z1 - z0;
  r = Math.max(0.001, Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002));
  return mk(new RoundedBoxGeometry(w, h, d, 3, r), mat, p, (x0 + x1) / 2, (h0 + h1) / 2, (z0 + z1) / 2);
}
const lc = (p, x, z, rT, rB, h0, h1, mat, seg = 24, shadow = true) =>
  mk(new THREE.CylinderGeometry(rT, rB, h1 - h0, seg), mat, p, x, (h0 + h1) / 2, z, shadow);
const lsph = (p, x, h, z, r, mat, shadow = true) => mk(new THREE.SphereGeometry(r, 20, 14), mat, p, x, h, z, shadow);
// Kollisionsbox (lokal) für den Rundgang – nur aktiv, solange Möbel sichtbar sind
function solid(g, x0, x1, z0, z1) {
  const a = g.rotation.y, c = Math.cos(a), s = Math.sin(a), ox = (x0 + x1) / 2, oz = (z0 + z1) / 2;
  solids.push({ cx: g.position.x + ox * c + oz * s, cz: g.position.z - ox * s + oz * c, hx: (x1 - x0) / 2, hz: (z1 - z0) / 2, a, furn: true });
}

const pb = (x0, x1, y0, y1, h0, h1, mat, shadow = true) => lb(P, wx(x0), wx(x1), h0, h1, wz(y0), wz(y1), mat, shadow);
const ps = (x0, x1, y0, y1, h0, h1, mat, r) => ls(P, wx(x0), wx(x1), h0, h1, wz(y0), wz(y1), mat, r);
const pc = (X, Y, rT, rB, h0, h1, mat, seg = 24, shadow = true) => lc(P, wx(X), wz(Y), rT, rB, h0, h1, mat, seg, shadow);
const psph = (X, Y, h, r, mat, shadow = true) => lsph(P, wx(X), h, wz(Y), r, mat, shadow);
const psolid = (x0, x1, y0, y1) => solid(P, wx(x0), wx(x1), wz(y0), wz(y1));
function rod(a, b, r, mat) {   // a, b = [X, Y, Höhe]
  const A = new THREE.Vector3(wx(a[0]), a[2], wz(a[1])), B = new THREE.Vector3(wx(b[0]), b[2], wz(b[1]));
  const d = B.clone().sub(A);
  const m = mk(new THREE.CylinderGeometry(r, r, d.length(), 8), mat, P, 0, 0, 0);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}

// Bett: Gruppe am Kopfende (Wand), Fußende zeigt in Blickrichtung
function bed(X, Y, deg, w, l, { head = F.beige, throwMat = F.sage } = {}) {
  const g = grp(X, Y, deg), hw = w / 2;
  ls(g, -hw - 0.06, hw + 0.06, 0, 1.05, 0, 0.09, head, 0.03);                 // Polster-Kopfteil
  ls(g, -hw - 0.05, hw + 0.05, 0.08, 0.36, 0.06, l + 0.12, head, 0.03);       // Bettrahmen
  for (const sx of [-hw, hw]) lc(g, sx, l + 0.06, 0.02, 0.015, 0, 0.08, F.oak, 8);
  ls(g, -hw, hw, 0.36, 0.58, 0.1, l + 0.1, F.linen, 0.05);                    // Matratze
  ls(g, -hw - 0.03, hw + 0.03, 0.42, 0.64, 0.55, l + 0.13, F.linen, 0.06);    // Bettdecke
  ls(g, -hw - 0.05, hw + 0.05, 0.44, 0.655, l - 0.32, l + 0.15, throwMat, 0.05); // Plaid
  const pw = Math.min(0.8, hw - 0.05);
  for (const sx of [-1, 1]) {
    const m = ls(g, sx * (hw / 2) - pw / 2, sx * (hw / 2) + pw / 2, 0.6, 0.76, 0.13, 0.5, F.linen, 0.07);
    m.rotation.x = 0.35;
  }
  solid(g, -hw - 0.06, hw + 0.06, 0, l + 0.15);
}

  ls(g, -0.2, 0.2, 0.45, 0.49, -0.18, 0.2, F.beige, 0.02);
  for (const sx of [-0.19, 0.19]) lc(g, sx, -0.205, 0.014, 0.014, 0.45, 0.8, F.oak, 10);
  ls(g, -0.21, 0.21, 0.64, 0.82, -0.225, -0.195, F.oak, 0.012);

function armchair(X, Y, deg, mat, { high = false } = {}) {
  const g = grp(X, Y, deg), top = high ? 1.08 : 0.84;
  for (const sx of [-0.29, 0.29]) for (const sz of [-0.29, 0.29]) lc(g, sx, sz, 0.022, 0.014, 0, 0.17, F.oak, 10);
  ls(g, -0.37, 0.37, 0.16, 0.4, -0.37, 0.36, mat, 0.05);                     // Sockel
  ls(g, -0.29, 0.29, 0.39, 0.5, -0.22, 0.36, mat, 0.05);                     // Sitzkissen
  ls(g, -0.37, 0.37, 0.36, top, -0.38, -0.2, mat, 0.07);                    // Rücken
  for (const sx of [-1, 1]) ls(g, sx * 0.33 - 0.05, sx * 0.33 + 0.05, 0.36, 0.64, -0.36, 0.34, mat, 0.04);       // Armlehnen
  if (high) for (const sx of [-1, 1]) ls(g, sx * 0.335 - 0.045, sx * 0.335 + 0.045, 0.64, top - 0.04, -0.38, -0.12, mat, 0.04); // Ohren
  const pl = ls(g, -0.19, 0.19, 0.5, 0.8, -0.2, -0.08, F.linen, 0.05);
  pl.rotation.x = -0.25;
  solid(g, -0.39, 0.39, -0.38, 0.36);
}
function pillow(X, Y, deg, h0, mat, s = 0.44) {
  const g = grp(X, Y, deg);
  ls(g, -s / 2, s / 2, h0, h0 + s * 0.9, -0.07, 0.07, mat, 0.06).rotation.x = -0.28;
}
function floorLamp(X, Y) {

  psolid(X - 0.15, X + 0.15, Y - 0.15, Y + 0.15);
}
function plant(X, Y, s = 1, h0 = 0, solidIt = true) {
  pc(X, Y, 0.17 * s, 0.13 * s, h0, h0 + 0.36 * s, F.pot, 20);
  pc(X, Y, 0.155 * s, 0.155 * s, h0 + 0.33 * s, h0 + 0.345 * s, F.soil, 20, false);
  pc(X, Y, 0.015 * s, 0.02 * s, h0 + 0.34 * s, h0 + 0.85 * s, F.soil, 6);
  const L = [[0, 0, 0.78, 0.3, F.leaf], [0.13, 0.05, 0.98, 0.24, F.leaf2], [-0.12, 0.08, 1.08, 0.22, F.leaf], [0.04, -0.13, 1.2, 0.2, F.leaf2], [-0.04, -0.02, 1.36, 0.16, F.leaf]];
  for (const [dx, dy, h, r, mat] of L) psph(X + dx * s, Y + dy * s, h0 + h * s, r * s, mat).scale.set(1, 1.25, 1);
  if (solidIt) psolid(X - 0.2 * s, X + 0.2 * s, Y - 0.2 * s, Y + 0.2 * s);
}
function teddy(X, Y, deg, h0 = 0, s = 1, mat = F.teddy) {
  const g = grp(X, Y, deg);
  lsph(g, 0, h0 + 0.09 * s, 0, 0.09 * s, mat).scale.set(1, 1.1, 0.9);
  lsph(g, 0, h0 + 0.24 * s, 0.01 * s, 0.07 * s, mat);
  lsph(g, 0, h0 + 0.225 * s, 0.065 * s, 0.026 * s, F.beige);
  for (const sx of [-1, 1]) {
    lsph(g, sx * 0.05 * s, h0 + 0.3 * s, 0, 0.026 * s, mat);
    lsph(g, sx * 0.08 * s, h0 + 0.03 * s, 0.06 * s, 0.035 * s, mat);
    lsph(g, sx * 0.09 * s, h0 + 0.12 * s, 0.03 * s, 0.032 * s, mat);
  }
}
function books(x0, x1, Y, h0, mats, { alongY = false } = {}) {   // stehende Bücher
  let x = x0, i = 0;
  while (x < x1 - 0.03) {
    const t = 0.02 + rand() * 0.025, hh = 0.17 + rand() * 0.08, m = mats[i++ % mats.length];
    if (alongY) pb(Y - 0.08, Y + 0.08, x, x + t, h0, h0 + hh, m);
    else pb(x, x + t, Y - 0.08, Y + 0.08, h0, h0 + hh, m);
    x += t + 0.004;
  }
}

// --- Wohnen (laut Foto): blaues Sofa an der Westwand, Teppich, Rollcontainer, Leselampe, Gardine,
//     Spielzeug-Elefant; runder Marmortisch Ø 1,20 mit 4 Freischwingern, Pendelleuchte, Regal, Pflanze ---
{

    candle: std(0xe6b8ae, 0.8),
    eleph:  std(0x9fb6c6, 0.45),
    pink:   std(0xe2b9a8, 0.6),
    sheer:  std(0xf8f6f1, 0.95, { side: THREE.DoubleSide, transparent: true, opacity: 0.85 }),
  };
  const caneTex = canvasTexture(256, 256, (g, w, h) => {
    g.fillStyle = '#cfae80'; g.fillRect(0, 0, w, h);
    const s = 32;
    g.strokeStyle = 'rgba(125,88,48,.55)'; g.lineWidth = 3;
    for (let i = -w; i < 2 * w; i += s) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i + h, h); g.stroke();
      g.beginPath(); g.moveTo(i, h); g.lineTo(i + h, 0); g.stroke();

    for (let i = 0; i < w; i += s / 2) {

  // Rohr in Gruppen-Koordinaten (a, b = [x, y, z])
  function ltube(g, a, b, r, mat) {

    const bk = new THREE.Group(); bk.position.set(0, 0.70, -0.235); bk.rotation.x = -0.12; g.add(bk);
    ls(bk, -0.24, 0.24, -0.12, 0.12, -0.012, 0.012, W.black, 0.01);    // Rückenrahmen
    lb(bk, -0.205, 0.205, -0.09, 0.09, -0.013, 0.013, cane, false);
    solid(g, -0.25, 0.25, -0.27, 0.27);

  // ---- Sofa: Rücken an der Westwand, Récamiere nach Norden (zum Fenster) ----

  // Teppich, Rollcontainer
  pb(1.25, 3.35, 0.75, 3.15, 0.003, 0.016, std(0xffffff, 1, { map: texFor(rugTex, 2.1, 2.4, 1.0) }), false);
  pc(1.95, 2.25, 0.16, 0.16, 0.016, 0.40, W.gloss, 40);
  pc(1.95, 2.25, 0.161, 0.161, 0.205, 0.212, F.greyD, 40, false);
  for (const h of [0.11, 0.31]) pb(1.92, 1.98, 2.40, 2.412, h, h + 0.04, F.greyD, false);   // Grifflöcher
  psolid(1.79, 2.11, 2.09, 2.41);

  pc(0.55, 0.46, 0.035, 0.07, 1.46, 1.56, F.brass, 20);

  // Gardine (transparent) an der Westseite des Fensters
  {

    for (let i = 0; i < pos.count; i++) {
      const u = (i % (n + 1)) / n, row = Math.floor(i / (n + 1));
      pos.setXYZ(i, wx(1.38 + 0.50 * u), row === 0 ? 2.52 : 0.03, wz(0.10 + 0.035 * Math.sin(u * 9 * 2 * Math.PI)));

  // Spielzeug-Elefant (hellblau) vor dem Fenster, Blick nach Osten

    for (const sx of [-0.09, 0.09]) for (const sz of [-0.16, 0.13]) lc(g, sx, sz, 0.05, 0.075, 0, 0.26, E, 16);

    const trunk = new THREE.CatmullRomCurve3([[0, 0.32, 0.34], [0, 0.22, 0.42], [0, 0.10, 0.44], [0, 0.05, 0.40]].map(p => new THREE.Vector3(...p)));
    mk(new THREE.TubeGeometry(trunk, 20, 0.035, 10), E, g, 0, 0, 0);

  // ---- Essplatz: Marmortisch Ø 1,20 auf Tulpenfuß, 4 Freischwinger ----
  const cx = 2.05, cy = 4.15, d = 0.56;

  {

    mk(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.004, 6), W.black, P, 0, 0, 0, false);
    pc(B[0], B[1], 0.05, 0.05, H - 0.025, H, F.white, 20, false);

  // Offenes Regal (weiß, Metall) an der Westwand

  // ---- Sideboard (H 70 cm) an der Ostwand gegenüber dem Sofa, darauf ein 55"-TV ----
  {
    const x0 = 3.91, x1 = 4.355, y0 = 0.70, y1 = 2.70, n = 4, legH = 0.12, top = 0.70;
    for (const x of [x0 + 0.05, x1 - 0.07]) for (const y of [y0 + 0.05, y1 - 0.07]) pb(x, x + 0.02, y, y + 0.02, 0, legH, W.black);
    pb(x0 + 0.02, x1, y0, y1, legH, top - 0.02, F.oak);                     // Korpus
    pb(x0, x1, y0 - 0.005, y1 + 0.005, top - 0.02, top, F.oak);             // Deckplatte

    psolid(x0, x1, y0, y1);

    const tc = 1.70, tx = 4.16;
    pb(tx - 0.11, tx + 0.11, tc - 0.20, tc + 0.20, top, top + 0.012, W.black);   // Fußplatte
    pb(tx - 0.012, tx + 0.012, tc - 0.04, tc + 0.04, top + 0.012, top + 0.10, W.black);

    pb(tx - 0.031, tx - 0.03, tc - 0.605, tc + 0.605, top + 0.09, top + 0.78, std(0x0a0b0d, 0.08, { metalness: 0.3 }), false);   // Bildschirm
    // Deko: Vase links, Bücher und Lautsprecher rechts
    pc(4.12, 0.88, 0.06, 0.045, top, top + 0.28, W.pink, 20);
    books(2.45, 2.62, 4.15, top, [F.toys[2], F.sage, F.greyD], { alongY: true });
  }
  // ---- Strelitzie (Strelitzia nicolai) im großen Topf ----
  {
    const g = grp(0.60, 4.85, 0);
    lc(g, 0, 0, 0.22, 0.17, 0, 0.42, F.pot, 28);
    lc(g, 0, 0, 0.205, 0.205, 0.39, 0.40, F.soil, 28, false);
    const leaves = [F.leaf, F.leaf2];
    for (let i = 0; i < 9; i++) {
      const az = i * 2 * Math.PI / 9 + (rand() - 0.5) * 0.5, tilt = 0.08 + rand() * 0.28, L = 0.55 + rand() * 0.55;

    }
    solid(g, -0.22, 0.22, -0.22, 0.22);

}

// --- Küche: Zeile West mit Kochfeld, Zeile Ost mit Spüle, Kühlschrank ---------------------
{
  const stoneTopTex = canvasTexture(512, 512, (g, w, h) => {

  });
  const K = {
    front: std(0xf1efea, 0.55),
    gap: std(0x9a968f, 0.9),
    glass: std(0x101112, 0.15, { metalness: 0.2 }),

    pb(x0, x1, y0, y1, 0.88, 0.92, std(0xffffff, 0.45, { map: texFor(stoneTopTex, x1 - x0, y1 - y0, 1.0) }));
  function side(along, f, dir) {

const RADIUS = 0.22, EYE = 1.65;
function collide(p) {
  for (let it = 0; it < 3; it++) {
    for (const s0 of solids) {
      if (s0.furn && !furniture.visible) continue;
      const s = s0.door ? doorBox(s0.door) : s0.dyn ? s0.dyn() : s0;
      const dx = p.x - s.cx, dz = p.z - s.cz, c = Math.cos(s.a), sn = Math.sin(s.a);
      const lx = dx * c - dz * sn, lz = dx * sn + dz * c;
      const qx = Math.max(-s.hx, Math.min(s.hx, lx)), qz = Math.max(-s.hz, Math.min(s.hz, lz));
      let ex = lx - qx, ez = lz - qz, d = Math.hypot(ex, ez);
      let px, pz;
      if (d > 1e-6) {
        if (d >= RADIUS) continue;
        px = ex / d * (RADIUS - d); pz = ez / d * (RADIUS - d);
      } else {
        const ox = s.hx - Math.abs(lx), oz = s.hz - Math.abs(lz);
        if (ox < oz) { px = Math.sign(lx || 1) * (ox + RADIUS); pz = 0; }
        else { px = 0; pz = Math.sign(lz || 1) * (oz + RADIUS); }
      }
      p.x += px * c + pz * sn;
      p.z += -px * sn + pz * c;
    }
  }
}
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function walkStep(dt) {
  let f = 0, r = 0;
  if (keys.KeyW || keys.ArrowUp) f += 1;
  if (keys.KeyS || keys.ArrowDown) f -= 1;
  if (keys.KeyD || keys.ArrowRight) r += 1;
  if (keys.KeyA || keys.ArrowLeft) r -= 1;
  if (!f && !r) return;
  camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
  right.crossVectors(fwd, camera.up).normalize();
  const speed = (keys.ShiftLeft || keys.ShiftRight ? 3.4 : 1.6) * dt / Math.hypot(f, r);
  camera.position.addScaledVector(fwd, f * speed).addScaledVector(right, r * speed);
  collide(camera.position);
  camera.position.y = EYE;
}

btnFurn.addEventListener('click', () => {
  furniture.visible = !furniture.visible;
  btnFurn.textContent = furniture.visible ? 'Möbel ausblenden' : 'Möbel einblenden';
});
// Bedienfeld nach links ein-/ausfahren (Zustand bleibt beim Neuladen erhalten)
const panel = document.getElementById('panel');
const btnHide = document.getElementById('btnHide'), btnShow = document.getElementById('btnShow');
function setPanel(collapsed, { focus = true } = {}) {
  panel.classList.toggle('collapsed', collapsed);
  document.body.classList.toggle('panel-collapsed', collapsed);
  panel.inert = collapsed;
  btnShow.inert = !collapsed;
  if (focus) (collapsed ? btnShow : btnHide).focus({ preventScroll: true });
  try { localStorage.setItem('wohnung-thomas.panelCollapsed', collapsed ? '1' : '0'); } catch (e) {}
}
btnHide.addEventListener('click', () => setPanel(true));
btnShow.addEventListener('click', () => setPanel(false));
let panelStart = false;
try { panelStart = localStorage.getItem('wohnung-thomas.panelCollapsed') === '1'; } catch (e) {}
setPanel(panelStart, { focus: false });
requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('preload')));
chkCeil.addEventListener('change', () => { setCeiling(chkCeil.checked); });
chkLabels.addEventListener('change', () => { labelRenderer.domElement.style.display = chkLabels.checked ? '' : 'none'; });
help.textContent = HELP.orbit;
applyTouch();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

// --- Türen anklicken ------------------------------------------------------------------
const pickRay = new THREE.Raycaster(), ndc = new THREE.Vector2();
let aimTimer = 0, downPos = null;
function pickDoor(clientX, clientY, center = false) {
  if (center) ndc.set(0, 0);
  else ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  pickRay.setFromCamera(ndc, camera);
  pickRay.far = center ? 3.0 : Infinity;
  const pickables = [...doorPick, ...occluders];
  const hits = pickRay.intersectObjects(pickables, false);
  if (!hits.length) return null;
  const u = hits[0].object.userData;
  return u.door || null;
}
function activate(d) {
  if (d) toggleDoor(d);
}
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (mode === 'walk' || !downPos) return;
  const moved = Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]);
  downPos = null;
  if (moved > 5) return;
  const d = pickDoor(e.clientX, e.clientY);
  activate(d);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode === 'walk' || e.buttons) return;
  renderer.domElement.style.cursor = pickDoor(e.clientX, e.clientY) ? 'pointer' : '';
});
document.addEventListener('mousedown', () => {
  if (mode === 'walk' && plc.isLocked) { const d = pickDoor(0, 0, true); activate(d); }
});
addEventListener('keydown', e => {
  if (e.code === 'KeyE' && mode === 'walk') { const d = pickDoor(0, 0, true); activate(d); }
});

// --- Render-Loop ---------------------------------------------------------------------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === 'walk') {
    walkStep(dt);
  } else {
    if (tween) {
      tween.t += dt;
      const k = ease(Math.min(1, tween.t / tween.dur));
      camera.position.lerpVectors(tween.p0, tween.p1, k);
      orbit.target.lerpVectors(tween.t0, tween.t1, k);
      if (k >= 1) tween = null;
    }
    orbit.update();
  }
  for (const d of doors) {
    if (d.t === d.target) continue;
    const step = dt / 0.7;
    d.t = d.target > d.t ? Math.min(d.target, d.t + step) : Math.max(d.target, d.t - step);
    d.pivot.rotation.y = d.a0 + d.delta * ease(d.t);
  }
  if (mode === 'walk' && plc.isLocked) {
    aimTimer -= dt;
    if (aimTimer <= 0) { aimTimer = 0.1; crosshair.classList.toggle('hot', !!pickDoor(0, 0, true)); }
  }
  updateLabelOcclusion(dt);
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

// Für Tests/Debugging
window.__app = { scene, camera, orbit, setMode, solids, doors, toggleDoor, furniture, collide, activate, get isTouch() { return isTouch; } };
</script>
</body>
